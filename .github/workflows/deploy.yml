name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run verification test suite
        run: npm test

      - name: Build static output
        run: npm run build

      - name: Deploy to Cloudflare Pages
        if: env.CF_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 8731d11f0dd513e9305c584846d8ceef
          command: pages deploy dist --project-name=wordcounter --branch=main

      - name: Skip deploy (no Cloudflare token)
        if: env.CF_API_TOKEN == ''
        run: echo "::warning::CLOUDFLARE_API_TOKEN secret is not set; build and tests passed but nothing was deployed"
